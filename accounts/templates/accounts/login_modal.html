{% load static %}
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content custom-bg">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">登入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="login-form" method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div id="login-error" class="alert alert-danger d-none"></div>
                    <div class="mb-3 position-relative">
                        <label for="username" class="form-label">使用者名稱</label>
                        <input type="text" class="form-control cart-input" id="username" name="username" placeholder="請輸入您的使用者名稱" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control cart-input" id="password" name="password" placeholder="請輸入您的密碼" required>
                    </div>
                    <button type="submit" class="btn btn-primary">登入</button>
                    <a href="#" class="ms-2" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#registerModal">沒有帳號？註冊</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('login-error');
    
    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        errorDiv.classList.add('d-none');
        errorDiv.innerHTML = '';

        const formData = new FormData(form);
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                window.location.reload();
            } else {
                errorDiv.classList.remove('d-none');
                errorDiv.innerHTML = data.errors.join('<br>');
            }
        } catch (error) {
            errorDiv.classList.remove('d-none');
            errorDiv.innerHTML = '發生錯誤，請稍後再試。';
        }
    });
});
</script>

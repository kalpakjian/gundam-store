{% load static %}

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">登入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm" method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">登入</button>
                    <a href="{% url 'accounts:register' %}" class="btn btn-link">沒有帳號？立即註冊</a>
                </form>
                <div id="formErrors" class="text-danger mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorDiv = document.getElementById('formErrors');
        errorDiv.innerHTML = '';
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            if (data.success) {
                alert(data.message);
                const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
                modal.hide();
                window.location.href = '{% url 'store:home' %}';
            } else {
                errorDiv.innerHTML = `<p>${data.errors.join(', ')}</p>`;
            }
        } catch (error) {
            errorDiv.innerHTML = '<p>發生錯誤，請稍後再試。</p>';
        }
    });
</script>

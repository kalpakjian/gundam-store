{% load static %}

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="registerModalLabel">註冊</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm" method="post" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">用戶名</label>
                        <input type="text" class="form-control" id="id_username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label">電子郵件</label>
                        <input type="email" class="form-control" id="id_email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="id_password1" name="password1" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password2" class="form-label">確認密碼</label>
                        <input type="password" class="form-control" id="id_password2" name="password2" required>
                    </div>
                    <button type="submit" class="btn btn-primary">註冊</button>
                    <a href="#" class="btn btn-link" onclick="switchToLoginModal()">已有帳號？立即登入</a>
                </form>
                <div id="registerFormErrors" class="text-danger mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorDiv = document.getElementById('registerFormErrors');
        errorDiv.innerHTML = '';
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            if (data.success) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('registerModal'));
                modal.hide();
                // 顯示成功訊息
                const successDiv = document.createElement('div');
                successDiv.className = 'alert alert-success alert-dismissible fade show';
                successDiv.innerHTML = `${data.message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                document.querySelector('.container.mt-4').prepend(successDiv);
                // 延遲 1 秒後重新載入頁面
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                for (const [field, errors] of Object.entries(data.errors)) {
                    errorDiv.innerHTML += `<p>${field}: ${errors.join(', ')}</p>`;
                }
            }
        } catch (error) {
            errorDiv.innerHTML = '<p>發生錯誤，請稍後再試。</p>';
        }
    });
</script>

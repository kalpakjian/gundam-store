{% load static %}

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="registerModalLabel">註冊</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm" method="post" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary">註冊</button>
                    <a href="{% url 'accounts:login' %}" class="btn btn-link">已有帳號？立即登入</a>
                </form>
                <div id="formErrors" class="text-danger mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorDiv = document.getElementById('formErrors');
        errorDiv.innerHTML = '';
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            if (data.success) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('registerModal'));
                modal.hide();
                // 顯示成功訊息
                const successDiv = document.createElement('div');
                successDiv.className = 'alert alert-success alert-dismissible fade show';
                successDiv.innerHTML = `${data.message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                document.querySelector('.container.mt-3').prepend(successDiv);
                // 延遲 1 秒後重定向到首頁
                setTimeout(() => {
                    window.location.href = '{% url 'store:home' %}';
                }, 1000);
            } else {
                for (const [field, errors] of Object.entries(data.errors)) {
                    errorDiv.innerHTML += `<p>${field}: ${errors.join(', ')}</p>`;
                }
            }
        } catch (error) {
            errorDiv.innerHTML = '<p>發生錯誤，請稍後再試。</p>';
        }
    });
</script>

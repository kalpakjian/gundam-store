<!-- accounts/templates/accounts/register_modal.html -->
{% load static %}
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">註冊</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="registerForm" method="POST" action="{% url 'accounts:register' %}">
          {% csrf_token %}
          <div id="formErrors" class="alert alert-danger d-none"></div>
          <div id="loadingSpinner" class="d-none text-center mb-3">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">載入中...</span>
            </div>
          </div>
          <div class="form-group mb-3">
            <label for="id_username">使用者名稱</label>
            <input type="text" name="username" id="id_username" class="form-control" required aria-describedby="usernameHelp">
            <small id="usernameHelp" class="form-text text-muted">請輸入唯一的使用者名稱</small>
          </div>
          <div class="form-group mb-3">
            <label for="id_email">電子郵件（選填）</label>
            <input type="email" name="email" id="id_email" class="form-control" aria-describedby="emailHelp">
            <small id="emailHelp" class="form-text text-muted">可選填，用於密碼恢復</small>
          </div>
          <div class="form-group mb-3">
            <label for="id_password1">密碼</label>
            <input type="password" name="password1" id="id_password1" class="form-control" required>
          </div>
          <div class="form-group mb-3">
            <label for="id_password2">確認密碼</label>
            <input type="password" name="password2" id="id_password2" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">註冊</button>
          <p class="mt-2 text-center">已有帳號？<a href="#" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-dismiss="modal">登入</a></p>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const form = this;
  const formData = new FormData(form);
  const errorDiv = document.getElementById('formErrors');
  const submitButton = form.querySelector('button[type="submit"]');
  const spinner = document.getElementById('loadingSpinner');
  const csrfToken = getCookie('csrftoken');

  const password1 = document.getElementById('id_password1').value;
  const password2 = document.getElementById('id_password2').value;
  if (password1 !== password2) {
    errorDiv.classList.remove('d-none');
    errorDiv.innerHTML = '密碼與確認密碼不一致';
    return;
  }

  form.querySelectorAll('.is-invalid').forEach(input => input.classList.remove('is-invalid'));
  errorDiv.classList.add('d-none');
  submitButton.disabled = true;
  spinner.classList.remove('d-none');

  fetch(form.action, {
    method: 'POST',
    body: formData,
    headers: {
      'X-Requested-With': 'XMLHttpRequest',
      'X-CSRFToken': csrfToken
    }
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    if (data.success) {
      const successAlert = document.createElement('div');
      successAlert.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
      successAlert.style.zIndex = '1050';
      successAlert.innerText = data.message || '註冊成功！請登入或繼續瀏覽。';
      document.body.appendChild(successAlert);

      $('#registerModal').modal('hide');
      form.reset();

      setTimeout(() => successAlert.remove(), 3000);
    } else {
      errorDiv.classList.remove('d-none');
      errorDiv.innerHTML = data.errors ? data.errors.map(error => {
        const [field, msg] = error.split(': ');
        const fieldNames = {
          username: '使用者名稱',
          email: '電子郵件',
          password1: '密碼',
          password2: '確認密碼',
          __all__: '整體錯誤'
        };
        const input = document.getElementById(`id_${field}`);
        if (input) input.classList.add('is-invalid');
        return `<p><strong>${fieldNames[field] || field}</strong>: ${msg}</p>`;
      }).join('') : '註冊失敗，請稍後再試。';
    }
  })
  .catch(error => {
    errorDiv.classList.remove('d-none');
    errorDiv.innerHTML = '發生錯誤：' + error.message;
    if (error.message.includes('403')) {
      errorDiv.innerHTML += '<br>可能是 CSRF 驗證失敗，請確保已啟用 cookie 並清除瀏覽器快取。';
    }
  })
  .finally(() => {
    submitButton.disabled = false;
    spinner.classList.add('d-none');
  });
});
</script>

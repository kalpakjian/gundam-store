{% load static %}
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content custom-bg">
            <div class="modal-header">
                <h5 class="modal-title" id="registerModalLabel">註冊</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="register-form" method="post" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    <div id="register-error" class="alert alert-danger d-none"></div>
                    <div class="mb-3 position-relative">
                        <label for="username" class="form-label">使用者名稱</label>
                        <input type="text" class="form-control cart-input" id="username" name="username" placeholder="請輸入唯一的使用者名稱" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <label for="email" class="form-label">電子郵件（選填）</label>
                        <input type="email" class="form-control cart-input" id="email" name="email" placeholder="可選填，用於密碼恢復">
                    </div>
                    <div class="mb-3 position-relative">
                        <label for="password1" class="form-label">密碼</label>
                        <input type="password" class="form-control cart-input" id="password1" name="password1" placeholder="請輸入您的密碼" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <label for="password2" class="form-label">確認密碼</label>
                        <input type="password" class="form-control cart-input" id="password2" name="password2" placeholder="請再次輸入密碼" required>
                    </div>
                    <button type="submit" class="btn btn-primary">註冊</button>
                    <a href="#" class="ms-2" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal">已有帳號？登入</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('register-form');
    const errorDiv = document.getElementById('register-error');
    
    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        errorDiv.classList.add('d-none');
        errorDiv.innerHTML = '';

        const formData = new FormData(form);
        try {
            const response = await fetch(form.action, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                window.location.href = '{% url 'accounts:login' %}';
            } else {
                errorDiv.classList.remove('d-none');
                errorDiv.innerHTML = data.errors.join('<br>');
            }
        } catch (error) {
            errorDiv.classList.remove('d-none');
            errorDiv.innerHTML = '發生錯誤，請稍後再試。';
        }
    });
});
</script>
